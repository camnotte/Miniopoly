/* Wi-Fi v0.2: purchase choice appears over the actual Mini-opoly board */
.board-frame-wrap{position:relative;min-width:0}
.purchase-layer{position:fixed;z-index:100000;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#031627bd;backdrop-filter:blur(3px)}
.purchase-layer[hidden]{display:none!important}
.purchase-dialog{background:linear-gradient(145deg,#f4f9f8,#e1f4f2);border:3px solid #6de1d2;color:#193849;border-radius:22px;box-shadow:0 18px 70px #000b;max-width:min(450px,100%);width:100%;padding:24px;max-height:95%;overflow:auto;text-align:center}
.purchase-kicker{font-size:11px;font-weight:700;color:#198879;letter-spacing:normal}
.purchase-dialog h2{font-size:clamp(22px,2.6vw,34px);line-height:1.12;margin:10px 0;word-wrap:break-word}
.purchase-dialog>p{font-size:13px;line-height:1.5;margin:10px 0}
.purchase-price-row{display:flex;justify-content:space-between;align-items:center;padding:11px 7px;border-bottom:1px solid #b4d0d3;text-align:left;font-size:13px}
.purchase-price-row strong{font-size:19px;color:#10334e}
.purchase-your-cash{border-bottom:0}
.purchase-dialog .purchase-hint{font-weight:700;color:#32596d}
.purchase-dialog .purchase-note{color:#55717b;font-size:11px;margin:12px 0 0}
.purchase-buttons{display:flex;gap:9px;margin-top:18px}.purchase-buttons button{flex:1;padding:14px 7px;font-size:13px}
.cash-mini{display:flex;align-items:center;justify-content:space-between;color:#a7cfda;background:#0c2536;padding:11px 13px;border-radius:11px;margin:4px 0 12px;font-size:13px}.cash-mini strong{font-size:18px;color:#a9faea}
@media(max-width:560px){.purchase-layer{padding:8px}.purchase-dialog{padding:17px}.purchase-buttons{flex-direction:column}.purchase-buttons button{min-height:44px}}

/* v0.2.2: a clear spinning state on the host/player sidebar, synchronized
   with the V5.42 3D canvas die. The final server roll is revealed at settle. */
.last-roll.dice-spinning{border-color:#78d8df;background:#174354}
.last-roll.dice-spinning b{display:inline-block;color:#ddfff3;animation:miniwifi-sidebar-die 0.55s ease-in-out infinite alternate}
@keyframes miniwifi-sidebar-die{from{transform:translateY(-3px) rotate(-8deg) scale(.86);opacity:.55}to{transform:translateY(2px) rotate(8deg) scale(1.15);opacity:1}}
@media(prefers-reduced-motion:reduce){.last-roll.dice-spinning b{animation:none}}

/* v0.2.3: the test-reset action remains visible on narrow windows. */
.session-head-actions{flex-wrap:wrap}
#resetButton{font-size:12px;border-color:#79babb;color:#cdf4ed}
#resetButton:not(:disabled):hover{background:#234958}


/* v0.2.4: purchase confirmation / rent / card draw / debt and turn-action center */
.modal-art{height:148px;border-radius:14px;margin:14px auto 12px;overflow:hidden;background:linear-gradient(135deg,#60858a,#20495c);display:flex;align-items:center;justify-content:center;border:1px solid #93ccc3}
.modal-art[hidden]{display:none!important}
.modal-art img{width:100%;height:100%;object-fit:cover;display:block}
.modal-art img[hidden],.modal-art #modalArtFallback[hidden]{display:none!important}
.modal-art #modalArtFallback{font-size:64px;text-shadow:0 3px 14px #122a4080}
.modal-details{background:#d6eae9;border:1px solid #accac9;color:#183a45;border-radius:12px;text-align:left;padding:12px;max-height:240px;overflow-y:auto;margin:12px 0}
.modal-details[hidden]{display:none!important}

.modal-asset-row span{flex:1}
.modal-asset-row button{padding:9px 10px;font-size:12px;flex-shrink:0}
.modal-details p{font-size:12px;line-height:1.5}
.modal-buttons{flex-wrap:wrap}
.modal-buttons button{flex:1 1 40%;min-height:43px}
.modal-buttons button.primary{background:#107d80;color:white}
.modal-buttons button.danger{background:#9b3030;color:white;border-color:#b34242}
.modal-buttons button:disabled{opacity:.5;cursor:not-allowed}
.modal-summary{margin:12px 0}
.purchase-dialog{max-width:min(490px,100%)}
@media(max-width:560px){.modal-buttons button{flex:1 1 100%}.modal-asset-row{flex-direction:column;align-items:stretch}.modal-art{height:115px}}

/* Approved bow-to-stern water: every path follows the hull backward. */

/* Preserve the approved artwork exactly; each avatar shows one cell of the sheet. */
.game-avatar {
  display: inline-block; flex: none; vertical-align: middle;
  width: var(--avatar-size, 28px); aspect-ratio: 4 / 5;
  background-image: url('/art/avatars/players-v1.png?v=0.3.40');
  background-size: 500% 200%; background-position: var(--avatar-x) var(--avatar-y);
  background-repeat: no-repeat; border-radius: 8px;
  clip-path: inset(1% 6% 3% 6% round 6px);
}
.game-avatar.is-personal { height: auto; aspect-ratio: 1; background-image: none; clip-path: none; object-fit: cover; border-radius: 50%; }
.entry-heading { display: grid; grid-template-columns: minmax(0,1fr) 88px; gap: 16px; align-items: start; margin: 28px 0 20px; }
.entry-heading-copy { min-width: 0; }
.entry-form .entry-heading h2 { margin: 0; line-height: 1.2; }
.entry-heading-copy p { margin: 9px 0 0; color: #60766b; font-size: 14px; line-height: 1.5; }
.personal-avatar-control { position: relative; width: 88px; height: 108px; }
.personal-avatar-frame { display: grid; place-items: center; width: 80px; height: 96px; padding: 0; overflow: hidden; border: 2px dashed #91a68a; border-radius: 50%; background: #eaf0dd; color: #426b58; cursor: pointer; box-shadow: none; }
.personal-avatar-frame [data-avatar-photo-preview] { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 11px; font-weight: 800; }
.personal-avatar-frame svg { width: 42px; height: 42px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.personal-avatar-frame .game-avatar.is-personal { width: 100%; height: 100%; border-radius: inherit; }
.personal-avatar-frame[aria-pressed="true"] { border: 2px solid #236956; box-shadow: 0 0 0 3px #bbd2a7; }
.personal-avatar-trash { position: absolute; right: 0; bottom: 3px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid #9cac91; border-radius: 50%; color: #824635; background: #fffaf0; box-shadow: 0 2px 5px #23452c26; }
.personal-avatar-trash svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.personal-avatar-frame:focus-visible, .personal-avatar-trash:focus-visible { outline: 3px solid #186cb0; outline-offset: 3px; }
.personal-avatar-frame:disabled { cursor: wait; }
.avatar-picker { min-width: 0; margin: 12px 0 18px; padding: 0; border: 0; }
.avatar-picker legend { padding: 0; margin-bottom: 8px; font-weight: 800; }
.avatar-row + .avatar-row { margin-top: 10px; }
.avatar-row-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
.avatar-row-heading h3 { margin: 0; font-size: 13px; font-weight: 800; color: #315c51; }
.avatar-row-heading [data-avatar-page] { font-size: 11px; color: #557261; }
.avatar-carousel { display: grid; grid-template-columns: 32px minmax(0,1fr) 32px; align-items: center; gap: 8px; }
.avatar-options { position: relative; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 3px; scrollbar-width: thin; padding: 4px 3px 8px; overscroll-behavior-x: contain; }
.avatar-options .avatar-option { flex: 0 0 calc((100% - 16px) / 3); scroll-snap-align: start; }
.avatar-arrow { display: grid; place-items: center; width: 32px; height: 44px; border: 1px solid #8ba38a; border-radius: 12px; background: #f7f1de; color: #244f43; font: 800 30px/1 var(--miniopoly-ui-font,Nunito), sans-serif; padding: 0; box-shadow: none; }
.avatar-arrow:disabled { opacity: .35; }
.avatar-review { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center; gap: 10px; margin: 12px 0; padding: 12px; background: #edf1df; border: 1px solid #b4c3a6; border-radius: 13px; }
.avatar-review-preview { display: grid; place-items: center; }
.avatar-review-preview .game-avatar { --avatar-size: 48px; }
.avatar-review-copy { min-width: 0; }
.avatar-review-copy strong { display: block; font-size: 13px; line-height: 1.35; color: #244f43; }
.avatar-review-copy p { margin: 4px 0 0; color: #496750; font-size: 12px; line-height: 1.4; }
.avatar-review [data-avatar-confirm] { padding: 9px 11px; border: 1px solid #245c4d; border-radius: 9px; background: #2e6a59; color: #fffaf0; font: 800 12px/1.3 var(--miniopoly-ui-font,Nunito), sans-serif; white-space: nowrap; box-shadow: none; }
.avatar-review [data-avatar-confirm]:focus-visible { outline: 3px solid #186cb0; outline-offset: 3px; }
.avatar-review.is-confirmed { border-color: #6b9673; background: #e5efd6; }
.avatar-review.is-confirmed [data-avatar-confirm] { opacity: 1; background: #e5efd6; border-color: #91af85; color: #315c43; }
[data-avatar-page] { white-space: nowrap; }
.avatar-arrow:focus-visible { outline: 3px solid #186cb0; outline-offset: 3px; }
.avatar-picker .avatar-help { font-size: 11px; line-height: 1.5; margin: 8px 0 0; color: #4b6957; }
.avatar-picker .avatar-upload-status { font-size: 12px; line-height: 1.5; margin: 6px 0 0; color: #245746; }
.avatar-upload-status:empty { display: none; }
.avatar-picker .avatar-upload-status.is-error { color: #963b27; }
.avatar-option, .avatar-pick {
  position: relative; display: flex; justify-content: center; align-items: center;
  min-width: 0; padding: 4px; border: 2px solid #aebda3; border-radius: 12px;
  background: #f7f1de; cursor: pointer;
}
.entry-form .avatar-option { margin: 0; gap: 0; }
.avatar-option .game-avatar, .avatar-pick .game-avatar { width: 100%; max-width: 64px; }
.avatar-option input, .avatar-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.avatar-option:has(input:checked), .avatar-pick:has(input:checked) {
  border-color: #236956; background: #e5f0cb; box-shadow: 0 0 0 2px #236956;
}
.avatar-option:has(input:checked)::after, .avatar-pick:has(input:checked)::after {
  content: '✓'; position: absolute; right: 0; bottom: 0; padding: 0 4px;
  border-radius: 6px 0 8px 0; color: #fff; background: #236956; font-weight: 900;
}
.avatar-option:focus-within, .avatar-pick:focus-within { outline: 3px solid #186cb0; outline-offset: 3px; }
#turnPanel .panel-player-name { align-items: center; }
#turnPanel .panel-player-name .game-avatar { --avatar-size: 36px; }
#turnPanel .panel-player-name > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.player-item .player-color { width: 40px; height: 50px; padding: 0; border-radius: 10px; }
.player-item .game-avatar { --avatar-size: 36px; }
.player-avatar { width: 32px; height: 38px; border-radius: 9px; overflow: hidden; }
.player-avatar .game-avatar { --avatar-size: 28px; }
.world-avatar .game-avatar, .world-deed-owner .game-avatar, .owner-pop .game-avatar { --avatar-size: 20px; }
.turn-finish-icon .game-avatar { --avatar-size: 72px; }
.world-explorer-player .game-avatar { --avatar-size: 32px; }
.avatar-select { grid-template-columns: repeat(5,minmax(0,1fr)); }
@media (max-width: 560px) {
  .entry-heading { grid-template-columns: minmax(0,1fr) 80px; gap: 10px; }
  .entry-form .entry-heading h2 { font-size: 22px; }
  .entry-heading-copy p { font-size: 12px; }
  .personal-avatar-control { width: 80px; }
  .personal-avatar-frame { width: 74px; height: 90px; }
  .avatar-review { grid-template-columns: 48px minmax(0,1fr); }
  .avatar-review [data-avatar-confirm] { grid-column: 1 / -1; min-height: 40px; }
}

/* Release identity stays visible as views, overlays and launcher pages change. */
(()=>{
  'use strict';
  const version='0.3.87';
  document.title=document.title.replace(/\bv\d+\.\d+\.\d+\b/g,'v'+version);
  window.MiniopolyBuildInfo=Object.freeze({version});
  // The parent game owns the badge when this board is embedded.
  if(window.self!==window.top)return;
  // Desktop --app windows identify themselves briefly so the native launcher
  // can tag their HWND. Ordinary browser windows never opt into this protocol.
  const desktopAddress=new URL(location.href),desktopId=desktopAddress.searchParams.get('miniDesktopWindow');
  if(/^[a-f0-9]{32}$/.test(desktopId||'')){
    desktopAddress.searchParams.delete('miniDesktopWindow');history.replaceState(null,'',desktopAddress.pathname+desktopAddress.search+desktopAddress.hash);
    const marker='\u2060'+[...desktopId].map(h=>parseInt(h,16).toString(2).padStart(4,'0').replaceAll('0','\u200b').replaceAll('1','\u200c')).join('')+'\u2060';
    const mark=()=>{if(!document.title.includes(marker))document.title+=marker;};mark();
    const titles=new MutationObserver(mark);titles.observe(document.querySelector('title'),{childList:true,subtree:true,characterData:true});
    setTimeout(()=>{titles.disconnect();document.title=document.title.replaceAll(marker,'');},60000);
  }
  const style=document.createElement('style');
  style.textContent=`.miniopoly-build-version{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(5px,env(safe-area-inset-bottom));z-index:2147483647;box-sizing:border-box;display:block;width:max-content;max-width:calc(100vw - 16px);padding:3px 7px;border:1px solid #82968b;border-radius:6px;background:#fff9eb;color:#234b41;font:700 11px/1.3 system-ui,sans-serif;letter-spacing:normal;text-transform:none;white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px #102a4226}dialog .miniopoly-build-version{position:sticky;bottom:0;margin:10px 0 0 auto}@media print{.miniopoly-build-version{position:static;margin:8px 0 0 auto}}`;
  document.head.append(style);
  function badge(container){

/* A browser preference only: fonts never change shared match rules or scores. */
(()=>{
  'use strict';
  const KEY='miniopoly_personal_options_v1';
  const choices=[
    {value:'nunito',label:'Nunito',family:'Nunito'},
    {value:'apple-chancery',label:'Apple Chancery',family:'Miniopoly Apple Chancery'},
    {value:'american-captain',label:'American Captain',family:'Miniopoly American Captain'}

  }
  function refreshControls(){
    for(const select of controls){
      for(const option of select.options){
        const choice=choices.find(choice=>choice.value===option.value);
        option.disabled=!available.has(choice.value);
        option.textContent=choice.label+(choice.value==='apple-chancery'&&!available.has(choice.value)?(checking?' · Checking…':' · Unavailable in this browser'):'');
      }
      select.value=effective;
      const help=select.closest('[data-font-setting]')?.querySelector('[data-font-help]');
      if(help)help.textContent=checking?'Checking available fonts…':!available.has('apple-chancery')?'Apple Chancery could not be accessed by this browser. On a Mac, enable it in Font Book and restart the browser, then check again.':'Applies only to this browser. Your choice is remembered for future games.';
    }

    if(pendingCheck)return pendingCheck;

      let loaded=false;
      try{const faces=await document.fonts.load('16px '+JSON.stringify(choice.family));loaded=faces.some(face=>face.status==='loaded');}catch{}

        if(!loaded){

          const systemFamily=['Apple Chancery','Apple-Chancery','AppleChancery','Apple Chancery Regular'].find(rendersSystemFont);

  }

    await (pendingCheck||ready);

    try{localStorage.setItem(KEY,JSON.stringify({...read(),font:selected}));}catch{}

  }
  function bindControls(root=document){
    for(const select of root.querySelectorAll('[data-font-preference]')){
      if(controls.has(select))continue;
      select.replaceChildren(...choices.map(choice=>{
        const option=document.createElement('option');option.value=choice.value;option.textContent=choice.label;return option;
      }));

    ready,bindControls,setPreference,checkFonts,getPreference:()=>selected,getEffective:()=>effective,

  });

  apply();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>bindControls());else bindControls();
})();
