.board-activity{margin:8px 8px 0;padding:8px 14px;background:#153b38f2;border:1px solid #aac3a64d;border-radius:14px;color:#fff4dd;font-size:13px;line-height:22px}
.board-activity #activityHeading{margin:0 0 4px;font:900 14px/20px Nunito,system-ui,sans-serif;color:#fff2ce}
.board-activity #activityLog{height:88px;max-height:88px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:auto;scrollbar-color:#a9c9aa #123c37;padding:0 10px 0 0;margin:0;outline-offset:4px}
.board-activity #activityLog:focus-visible{outline:3px solid #f1d593;border-radius:3px}
.board-activity #activityLog .activity-line{padding:0;margin:0;border:0;background:transparent;color:#f1f4e7;line-height:22px;min-height:22px;overflow-wrap:anywhere}
body:not(.live-turn-layout) .board-activity{display:none}
.action-hint{position:relative;display:inline-flex;align-items:center}
button.action-hint-toggle{border-radius:50%;padding:5px 9px;min-width:34px;background:#e8efdf;color:#254e43;font-size:19px;border:1px solid #6e8e72}
.action-hint-text{display:none;position:absolute;bottom:calc(100% + 7px);right:0;width:min(260px,70vw);padding:12px;border-radius:10px;background:#163d35;color:#fff7de;box-shadow:0 4px 18px #0005;font-size:14px;line-height:1.4;z-index:10;pointer-events:none}
.action-hint:is(:focus-within,.is-open,.is-focused) .action-hint-text{display:block}
#modalArt{object-fit:contain}.modal-asset-row:has(button + button){flex-wrap:wrap}
#board.mini-world-fade-out{animation:miniWorldOut 1.3s ease-in-out both;pointer-events:none}
#board.mini-world-fade-in{animation:miniWorldIn 1.7s ease-out both;pointer-events:none}
@keyframes miniWorldOut{to{opacity:.015;filter:blur(22px) saturate(.15);transform:scale(.985)}}
@keyframes miniWorldIn{from{opacity:.015;filter:blur(22px) saturate(.15);transform:scale(1.015)}to{opacity:1;filter:none;transform:none}}
.boardwrap .mini-live-shift{background:#143c3680;pointer-events:none}
.mini-bonus-announcement{position:absolute;z-index:55;top:34%;left:50%;transform:translateX(-50%);width:min(56%,460px);padding:14px 20px;border:3px solid #ffe38c;border-radius:22px;box-shadow:0 0 32px #ffdd8a90,0 12px 40px #0f352ca8;background:#254e3df5;color:#fff5d1;text-align:center;pointer-events:none;font:900 clamp(14px,2.3vw,26px)/1.2 Nunito,system-ui,sans-serif;animation:miniBonusPop .45s ease-out both}
.mini-bonus-announcement span{display:block;font-size:42px;color:#ffe38c;animation:miniBonusStar 1s ease-in-out}.mini-bonus-announcement.is-setback{background:#744a30f5;border-color:#ffd0a2}
@keyframes miniBonusPop{0%{opacity:0;transform:translateX(-50%) scale(.65)}70%{transform:translateX(-50%) scale(1.04)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes miniBonusStar{from{transform:rotate(-80deg) scale(.4)}to{transform:rotate(80deg) scale(1)}}
.boardwrap .miniwifi-special-card{background:#f6f1dff7;color:#234c42;border-color:#d8bb77;box-shadow:0 12px 38px #0a2d3880;font-family:Nunito,system-ui,sans-serif}
.boardwrap .miniwifi-special-title{color:#234c42;font-family:inherit;letter-spacing:0}.boardwrap .miniwifi-special-kicker,.boardwrap .miniwifi-special-detail{color:#3f665b;font-family:inherit;letter-spacing:0}
.mini-special-media{display:block;width:clamp(65px,19vw,155px);height:clamp(65px,19vw,155px);object-fit:contain;border-radius:12px}
.boardwrap .miniwifi-special-card.is-card-draw{animation:miniCardDraw .95s cubic-bezier(.2,.7,.2,1) both;transform-origin:center}
@keyframes miniCardDraw{0%{opacity:.7;transform:translate(var(--draw-x,0px),var(--draw-y,90px)) rotate(-10deg) scale(.18)}45%{opacity:1;transform:translate(0,-15px) rotateY(85deg) scale(.8)}100%{transform:translate(0,0) rotateY(0) scale(1)}}
.miniwifi-special-emblem{animation:miniSpecialBob 1.2s ease-in-out infinite alternate}
@keyframes miniSpecialBob{from{transform:translateY(2px) rotate(-5deg)}to{transform:translateY(-7px) rotate(5deg)}}
@media(max-width:850px){.board-activity{font-size:12px;padding:10px;margin:5px 4px 0}body.live-turn-layout .board-shell iframe{min-height:0!important}.mini-bonus-announcement{padding:9px 8px;top:35%}.mini-bonus-announcement span{font-size:28px}}
@media(prefers-reduced-motion:reduce){#board.mini-world-fade-out,#board.mini-world-fade-in,.mini-bonus-announcement,.mini-bonus-announcement span,.boardwrap .miniwifi-special-card.is-card-draw,.miniwifi-special-emblem{animation:none!important;filter:none!important;opacity:1!important}}

.mini-special-media.is-illustrated-motion,#modalArt.is-illustrated-motion{animation:miniSpecialBob 1s ease-in-out 3 alternate}
@media(prefers-reduced-motion:reduce){.mini-special-media.is-illustrated-motion,#modalArt.is-illustrated-motion{animation:none!important}}

/* Activity lives in the outer page; retain this narration for assistive readers. */
html.mini-live-turn-panel #miniwifi-motion-notice.visible{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}

/* Uniform, audited colors for every original special-space animation. */
.boardwrap .miniwifi-special-card[data-kind]{background:#fff6e5!important;color:#173f37!important;border-color:#c9a95e;box-shadow:0 14px 45px #061f31a6}
.boardwrap .miniwifi-special-card[data-kind] :is(.miniwifi-special-title,.miniwifi-special-kicker,.miniwifi-special-detail){color:#173f37!important;text-shadow:none!important;opacity:1}
.boardwrap .miniwifi-special-card[data-kind] .miniwifi-special-amount{color:#12613c!important;background:#e4efda;border:1px solid #b4ca9c;border-radius:10px;padding:5px 13px;text-shadow:none;font-weight:900}
.boardwrap .miniwifi-special-card[data-kind] .miniwifi-special-amount.negative{color:#8c2d25!important;background:#fce4d9;border-color:#d6aa97}
.boardwrap .mini-live-shift{background:#102b40a6!important;backdrop-filter:blur(2px)}
.boardwrap .mini-live-shift :is(strong,span,small){color:#fff4da!important;text-shadow:0 2px 6px #071a29;font-family:Nunito,system-ui,sans-serif}
/* Independent wheels preserve the approved original body and orientation. */
.car-rig,.cat-rig{position:relative;display:block;width:100%;height:100%;pointer-events:none}
.car-rig .car-body,.car-rig .car-wheels,.cat-rig>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.car-rig .car-wheels{overflow:visible}
.car-wheel-spokes{transform-origin:0 0;transform-box:view-box}
.car-rig.is-moving .car-wheel-spokes{animation:miniWheelSpin .28s linear infinite}
@keyframes miniWheelSpin{to{transform:rotate(360deg)}}
.token-art.cat-art{display:block!important;width:100%!important;height:100%!important;filter:drop-shadow(0 2px 1px #17223954)}
.tile .token.image-token.cat-token{width:clamp(36px,4vw,58px)!important;height:clamp(30px,3.4vw,48px)!important;max-width:52%!important;background:transparent!important;border:0!important;border-radius:0!important;overflow:visible!important}
.boardwrap .miniwifi-walking-piece .cat-art{width:100%;height:100%}
.cat-rig.is-moving .cat-leg{animation:miniCatStep .38s ease-in-out infinite alternate;transform-origin:0 0;transform-box:view-box}
.cat-rig.is-moving .cat-back-leg.cat-near-leg,.cat-rig.is-moving .cat-front-leg.cat-far-leg{animation-direction:alternate-reverse}
.cat-rig.is-moving .cat-body{animation:miniCatBob .38s ease-in-out infinite alternate;transform-origin:center}
@keyframes miniCatStep{from{transform:rotate(-19deg)}to{transform:rotate(19deg)}}
@keyframes miniCatBob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
:is(.miniwifi-walking-piece,.token.cat-token)[data-heading="west"] .cat-art{transform:scaleX(-1)}
:is(.miniwifi-walking-piece,.token.cat-token)[data-heading="north"] .cat-art{transform:rotate(-90deg)}
:is(.miniwifi-walking-piece,.token.cat-token)[data-heading="south"] .cat-art{transform:rotate(90deg)}
@media(prefers-reduced-motion:reduce){.car-rig.is-moving .car-wheel-spokes,.cat-rig.is-moving .cat-leg,.cat-rig.is-moving .cat-body{animation:none!important}}
